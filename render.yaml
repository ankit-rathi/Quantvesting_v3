services:
  - type: web
    name: quantvesting-v3-ankit
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn quantvesting.api.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: PYTHONPATH
        value: src
      - key: QV_CONFIG_PATH
        value: config/strategy.yaml
      - key: QV_MARKET_DATA_DIR
        value: market_data
      - key: QV_PORTFOLIO_DATA_ROOT
        value: portfolio_data
      - key: QV_PORTFOLIO_ID
        value: ankit
      - key: QV_ACCESS_KEY
        sync: false
